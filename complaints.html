<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            margin: 0 auto;
            padding: 40px;
        }

        .header { text-align: center; margin-bottom: 40px; }

        .logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle { color: #666; font-size: 1.1em; }

        .message {
            padding: 15px; border-radius: 8px; margin-bottom: 24px; display: none;
            font-weight: 500;
        }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.show    { display: block; }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group label .required {
            color: #e53e3e;
            margin-left: 3px;
        }

        .form-group input[type="date"],
        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 11px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: 'Segoe UI', sans-serif;
            color: #333;
            background: white;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: auto;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }

        .form-group select option { color: #333; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .divider {
            border: none;
            border-top: 2px solid #f0f0f0;
            margin: 28px 0;
        }

        .section-label {
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #888;
            margin-bottom: 18px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-reset {
            width: 100%;
            padding: 12px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s, color 0.2s;
        }
        .btn-reset:hover { background: #f0f0ff; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
        }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .container { padding: 24px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>

<script type="module">
    import { initializeApp }   from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc, serverTimestamp }
                                from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
        apiKey:            "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
        authDomain:        "oesperformance-a54c0.firebaseapp.com",
        projectId:         "oesperformance-a54c0",
        storageBucket:     "oesperformance-a54c0.firebasestorage.app",
        messagingSenderId: "484894102454",
        appId:             "1:484894102454:web:17535ee497eac2d90d6717",
        measurementId:     "G-R56BGZYV8N"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // Default date received to today
    document.getElementById('dateReceived').valueAsDate = new Date();

    function showMessage(text, type) {
        const el = document.getElementById('message');
        el.textContent = text;
        el.className = `message ${type} show`;
        setTimeout(() => el.className = 'message', 5000);
    }

    window.submitComplaint = async function() {
        const dateReceived = document.getElementById('dateReceived').value;
        const targetDate   = document.getElementById('targetDate').value;
        const jobRef       = document.getElementById('jobRef').value.trim();
        const ftl          = document.getElementById('ftl').value;
        const engineer     = document.getElementById('engineer').value;

        if (!dateReceived || !targetDate || !jobRef || !ftl || !engineer) {
            showMessage('Please fill in all required fields.', 'error');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
            await addDoc(collection(db, 'Complaints'), {
                dateReceived,
                targetDate,
                jobRef,
                ftl,
                engineer,
                status:           'in-progress',
                engineerInformed: false,
                uploadedFiles:    [],
                submittedAt:      serverTimestamp()
            });

            showMessage('✓ Complaint submitted successfully!', 'success');
            resetForm();
        } catch (err) {
            console.error(err);
            showMessage('Error saving complaint: ' + err.message, 'error');
        }

        btn.disabled = false;
        btn.textContent = '💾 Submit Complaint';
    };

    window.resetForm = function() {
        document.getElementById('dateReceived').valueAsDate = new Date();
        document.getElementById('targetDate').value = '';
        document.getElementById('jobRef').value     = '';
        document.getElementById('ftl').value        = '';
        document.getElementById('engineer').value   = '';
    };
</script>
