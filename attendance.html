<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Establishment Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A1628;
  --bg2: #111f38;
  --bg3: #1a2942;
  --border: #2a3f5f;
  --border2: #1e3050;
  --text: #E8EDF2;
  --muted: #7a8fa8;
  --faint: #3a5070;
  --accent: #00A3E0;
  --accent2: #005EB8;
  --green: #10B981;
  --amber: #F59E0B;
  --red: #EF4444;
  --purple: #8B5CF6;
  --cell-in: #0d2a1a;
  --cell-in-text: #4ade80;
  --cell-hol: #1a1a2e;
  --cell-hol-text: #818cf8;
  --cell-sick: #2a1010;
  --cell-sick-text: #f87171;
  --cell-aaup: #2a1f00;
  --cell-aaup-text: #fbbf24;
  --cell-aap: #0d1f2a;
  --cell-aap-text: #38bdf8;
  --cell-hdh: #1f1030;
  --cell-hdh-text: #c084fc;
  --cell-train: #1a1a10;
  --cell-train-text: #a3e635;
  --cell-wknd: #0d1525;
  --sans: 'IBM Plex Sans', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 10% 20%, rgba(0,163,224,0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 90% 80%, rgba(0,94,184,0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(10, 22, 40, 0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  gap: 16px;
}

.header-left { display: flex; align-items: center; gap: 16px; }

.logo-mark {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
}

.header-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.header-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.header-right { display: flex; align-items: center; gap: 10px; }

/* Month nav */
.month-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
}
.month-nav-btn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  width: 28px; height: 28px;
  border-radius: 6px;
  display: grid; place-items: center;
  font-size: 14px;
  transition: all 0.15s;
}
.month-nav-btn:hover { background: var(--border); color: var(--text); }
.month-label {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  min-width: 110px;
  text-align: center;
  letter-spacing: 0.04em;
}

.btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  border: none;
  border-radius: 8px;
  padding: 7px 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-accent {
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  color: #fff;
}
.btn-accent:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-ghost {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--muted);
}
.btn-ghost:hover { color: var(--text); border-color: var(--accent); }

/* ── Toolbar ── */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border2);
  background: var(--bg2);
  position: relative;
  z-index: 1;
  gap: 12px;
  flex-wrap: wrap;
}

.legend {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-family: var(--mono);
  color: var(--muted);
}
.legend-dot {
  width: 20px; height: 16px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: 600;
}

.toolbar-actions { display: flex; align-items: center; gap: 8px; }

/* ── Staff search ── */
.staff-search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.staff-search {
  font-family: var(--sans);
  font-size: 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 6px 12px 6px 30px;
  outline: none;
  width: 160px;
  transition: border-color 0.15s;
}
.staff-search:focus { border-color: var(--accent); }
.staff-search-icon {
  position: absolute;
  left: 9px;
  color: var(--muted);
  font-size: 12px;
  pointer-events: none;
}

/* ── Grid wrapper ── */
.grid-outer {
  position: relative;
  z-index: 1;
  overflow: auto;
  max-height: calc(100vh - 130px);
}

/* ── Table ── */
.report-table {
  border-collapse: separate;
  border-spacing: 0;
  width: max-content;
  min-width: 100%;
}

/* Sticky column — staff names */
.col-staff {
  position: sticky;
  left: 0;
  z-index: 30;
  background: var(--bg2);
  min-width: 180px;
  max-width: 180px;
  border-right: 2px solid var(--border);
}

/* Sticky header row */
.report-table thead th {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg3);
  border-bottom: 2px solid var(--border);
  padding: 0;
  height: 56px;
}
/* Corner cell — sticky both */
.report-table thead th.col-staff {
  z-index: 40;
  background: var(--bg3);
}

.th-staff-inner {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 8px 14px;
  height: 100%;
}
.th-staff-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.th-staff-count {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
  line-height: 1;
}

.th-day-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 2px;
  padding: 6px 2px;
  min-width: 46px;
}
.th-day-name {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.th-day-num {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  line-height: 1;
}
.th-day-inner.today { background: rgba(0,163,224,0.08); border-bottom: 2px solid var(--accent); }
.th-day-inner.today .th-day-num { color: var(--accent); }
.th-day-inner.weekend { background: var(--cell-wknd); }
.th-day-inner.weekend .th-day-name,
.th-day-inner.weekend .th-day-num { color: var(--faint); }

/* Body rows */
.report-table tbody tr { transition: background 0.1s; }
.report-table tbody tr:hover .col-staff { background: var(--bg3); }
.report-table tbody tr:hover td:not(.col-staff):not(.cell-wknd) { filter: brightness(1.12); }

.td-staff {
  padding: 0 14px;
  height: 42px;
  border-bottom: 1px solid var(--border2);
  border-right: 2px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.staff-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  display: grid; place-items: center;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  flex-shrink: 0;
  font-family: var(--mono);
}
.staff-name {
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Day cells */
.report-table tbody td.cell-day {
  height: 42px;
  min-width: 46px;
  border-bottom: 1px solid var(--border2);
  border-right: 1px solid var(--border2);
  padding: 0;
  text-align: center;
  vertical-align: middle;
  cursor: pointer;
  position: relative;
}
.report-table tbody td.cell-wknd {
  background: var(--cell-wknd);
  cursor: default;
  border-right: 1px solid var(--border2);
  border-bottom: 1px solid var(--border2);
}

/* Status chips inside cells */
.cell-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 24px;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: transform 0.1s;
  position: relative;
}
.cell-day:hover .cell-chip { transform: scale(1.1); }

/* Status colours */
.s-In       { background: var(--cell-in);   color: var(--cell-in-text); }
.s-Holiday  { background: var(--cell-hol);  color: var(--cell-hol-text); }
.s-Half     { background: var(--cell-hdh);  color: var(--cell-hdh-text); }
.s-Sick     { background: var(--cell-sick); color: var(--cell-sick-text); }
.s-AAUP     { background: var(--cell-aaup); color: var(--cell-aaup-text); }
.s-AAP      { background: var(--cell-aap);  color: var(--cell-aap-text); }
.s-Training { background: var(--cell-train);color: var(--cell-train-text); }
.s-BH       { background: var(--cell-hol);  color: var(--cell-hol-text); }

/* Today column highlight */
.cell-today { background: rgba(0,163,224,0.04); }

/* Totals row */
.totals-row td {
  background: var(--bg3);
  border-top: 2px solid var(--border);
  border-bottom: none;
  height: 36px;
  font-family: var(--mono);
  font-size: 11px;
  text-align: center;
  vertical-align: middle;
  color: var(--muted);
  position: sticky;
  bottom: 0;
  z-index: 10;
}
.totals-row td.col-staff {
  z-index: 20;
  text-align: left;
  padding: 0 14px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── Edit dropdown popup ── */
.cell-popup {
  position: absolute;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  z-index: 500;
  min-width: 160px;
  overflow: hidden;
  animation: popIn 0.15s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}
.popup-header {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 10px;
  font-family: var(--mono);
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.popup-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  transition: background 0.1s;
  font-size: 12px;
  font-weight: 500;
}
.popup-option:hover { background: var(--bg); }
.popup-dot {
  width: 24px; height: 18px;
  border-radius: 4px;
  display: grid; place-items: center;
  font-size: 8.5px;
  font-family: var(--mono);
  font-weight: 600;
  flex-shrink: 0;
}

/* ── Loading overlay ── */
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(10,22,40,0.85);
  backdrop-filter: blur(6px);
  display: grid; place-items: center;
  z-index: 900;
}
.loading-overlay.hidden { display: none; }
.spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }

/* ── Save indicator ── */
.save-pill {
  position: fixed;
  bottom: 20px; right: 20px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 8px 16px;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--muted);
  display: flex; align-items: center; gap: 8px;
  z-index: 800;
  transition: all 0.3s;
  transform: translateY(80px);
}
.save-pill.show { transform: translateY(0); }
.save-pill.saved { border-color: var(--green); color: var(--green); }
.save-pill.saving { border-color: var(--accent); color: var(--accent); }
.save-pill.error { border-color: var(--red); color: var(--red); }
.save-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 70px; left: 50%; transform: translateX(-50%) translateY(60px);
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 12px;
  font-family: var(--mono);
  z-index: 900;
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
  white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* Scrollbars */
.grid-outer::-webkit-scrollbar { width: 6px; height: 6px; }
.grid-outer::-webkit-scrollbar-track { background: var(--bg2); }
.grid-outer::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
.grid-outer::-webkit-scrollbar-thumb:hover { background: var(--faint); }

/* Empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 80px 20px; color: var(--muted); text-align: center;
  gap: 12px;
}
.empty-state-icon { font-size: 48px; opacity: 0.4; }
.empty-state-text { font-size: 14px; }
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div>
    <div class="spinner"></div>
    <div class="loading-text">Loading establishment data…</div>
  </div>
</div>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="logo-mark">📋</div>
    <div>
      <div class="header-title">Establishment Report</div>
      <div class="header-sub">Attendance Overview</div>
    </div>
  </div>
  <div class="header-right">
    <div class="month-nav">
      <button class="month-nav-btn" id="prevMonth" title="Previous month">‹</button>
      <span class="month-label" id="monthLabel">—</span>
      <button class="month-nav-btn" id="nextMonth" title="Next month">›</button>
    </div>
    <button class="btn btn-accent" id="addStaffBtn">+ Add Staff</button>
  </div>
</header>

<!-- Toolbar -->
<div class="toolbar">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot s-In">In</div> In</div>
    <div class="legend-item"><div class="legend-dot s-Holiday">H</div> Holiday</div>
    <div class="legend-item"><div class="legend-dot s-Half">½H</div> Half-day Hol</div>
    <div class="legend-item"><div class="legend-dot s-Sick">S</div> Sick</div>
    <div class="legend-item"><div class="legend-dot s-AAUP">AU</div> AAUP</div>
    <div class="legend-item"><div class="legend-dot s-AAP">AP</div> AAP</div>
    <div class="legend-item"><div class="legend-dot s-Training">Tr</div> Training</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--cell-wknd);color:var(--faint);">—</div> Weekend</div>
    <div class="legend-item"><div class="legend-dot s-BH">BH</div> Bank Hol</div>
  </div>
  <div class="toolbar-actions">
    <div class="staff-search-wrap">
      <span class="staff-search-icon">⌕</span>
      <input class="staff-search" type="text" id="staffSearch" placeholder="Search staff…">
    </div>
    <button class="btn btn-ghost" id="todayBtn">Today</button>
  </div>
</div>

<!-- Grid -->
<div class="grid-outer" id="gridOuter">
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-state-icon">👥</div>
    <div class="empty-state-text">No staff found. Add staff to get started.</div>
  </div>
  <table class="report-table" id="reportTable" style="display:none;">
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
    <tfoot id="tableFoot"></tfoot>
  </table>
</div>

<!-- Status popup -->
<div class="cell-popup" id="cellPopup" style="display:none;"></div>

<!-- Save pill -->
<div class="save-pill" id="savePill">
  <div class="save-dot"></div>
  <span id="savePillText">Saving…</span>
</div>

<div id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import {
  getFirestore, collection, doc,
  getDocs, setDoc, deleteDoc, query, where
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
  authDomain: "oesperformance-a54c0.firebaseapp.com",
  projectId: "oesperformance-a54c0",
  storageBucket: "oesperformance-a54c0.firebasestorage.app",
  messagingSenderId: "484894102454",
  appId: "1:484894102454:web:17535ee497eac2d90d6717"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── UK Bank Holidays (England & Wales) ────────────────────────────────────
const BANK_HOLIDAYS = new Set([
  '2024-01-01','2024-03-29','2024-04-01','2024-05-06','2024-05-27',
  '2024-08-26','2024-12-25','2024-12-26',
  '2025-01-01','2025-04-18','2025-04-21','2025-05-05','2025-05-26',
  '2025-08-25','2025-12-25','2025-12-26',
  '2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25',
  '2026-08-31','2026-12-25','2026-12-28',
]);

const STATUS_OPTIONS = [
  { code:'In',       label:'In',              abbr:'In',  cls:'s-In' },
  { code:'Holiday',  label:'Holiday',         abbr:'H',   cls:'s-Holiday' },
  { code:'Half day Holiday', label:'Half-day Holiday', abbr:'½H', cls:'s-Half' },
  { code:'Sick',     label:'Sick',            abbr:'S',   cls:'s-Sick' },
  { code:'AAUP',     label:'AAUP (Unpaid)',   abbr:'AU',  cls:'s-AAUP' },
  { code:'AAP',      label:'AAP (Paid)',      abbr:'AP',  cls:'s-AAP' },
  { code:'Training', label:'Training',        abbr:'Tr',  cls:'s-Training' },
];

function dateKey(year, month1, day) {
  return `${year}-${String(month1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function isWeekend(year, month1, day) {
  const d = new Date(year, month1 - 1, day).getDay();
  return d === 0 || d === 6;
}
function isBankHoliday(key) { return BANK_HOLIDAYS.has(key); }
function daysInMonth(year, month1) { return new Date(year, month1, 0).getDate(); }
function dayName(year, month1, day) {
  return new Date(year, month1 - 1, day).toLocaleDateString('en-GB', { weekday:'short' });
}

// ── State ──────────────────────────────────────────────────────────────────
const now = new Date();
let viewYear  = now.getFullYear();
let viewMonth = now.getMonth() + 1; // 1-based
let staff = [];       // [{id, name}]
let entries = {};     // { staffId: { 'YYYY-MM-DD': 'Status' } }
let searchQ = '';

// ── Elements ──────────────────────────────────────────────────────────────
const monthLabel  = document.getElementById('monthLabel');
const tableHead   = document.getElementById('tableHead');
const tableBody   = document.getElementById('tableBody');
const tableFoot   = document.getElementById('tableFoot');
const reportTable = document.getElementById('reportTable');
const emptyState  = document.getElementById('emptyState');
const loadingOverlay = document.getElementById('loadingOverlay');
const cellPopup   = document.getElementById('cellPopup');
const savePill    = document.getElementById('savePill');
const savePillText= document.getElementById('savePillText');

// ── Init ──────────────────────────────────────────────────────────────────
document.getElementById('prevMonth').addEventListener('click', () => { changeMonth(-1); });
document.getElementById('nextMonth').addEventListener('click', () => { changeMonth(1); });
document.getElementById('todayBtn').addEventListener('click',  goToday);
document.getElementById('addStaffBtn').addEventListener('click', promptAddStaff);
document.getElementById('staffSearch').addEventListener('input', e => { searchQ = e.target.value.trim().toLowerCase(); renderGrid(); });
document.addEventListener('click', handleDocClick);

loadAll();

// ── Firebase ──────────────────────────────────────────────────────────────
async function loadAll() {
  showLoading(true);
  try {
    // Load staff
    const staffSnap = await getDocs(collection(db, 'Establishment Report'));
    staff = [];
    entries = {};
    staffSnap.forEach(d => {
      const data = d.data();
      if (data._type === 'staff') {
        staff.push({ id: d.id, name: data.name });
        entries[d.id] = {};
      }
    });
    staff.sort((a,b) => a.name.localeCompare(b.name));

    // Load entries for current month
    await loadEntriesForMonth(viewYear, viewMonth);
  } catch(e) {
    console.error(e);
    toast('Error loading data', true);
  }
  showLoading(false);
  renderGrid();
}

async function loadEntriesForMonth(year, month) {
  const prefix = `${year}-${String(month).padStart(2,'0')}`;
  try {
    const q = query(collection(db, 'Establishment Report'), where('_type','==','entry'), where('month','==',prefix));
    const snap = await getDocs(q);
    snap.forEach(d => {
      const data = d.data();
      if (!entries[data.staffId]) entries[data.staffId] = {};
      entries[data.staffId][data.date] = data.status;
    });
  } catch(e) {
    console.error('Error loading entries:', e);
  }
}

async function saveEntry(staffId, dateStr, status) {
  showSave('saving');
  const docId = `entry_${staffId}_${dateStr}`;
  const prefix = dateStr.substring(0,7);
  try {
    await setDoc(doc(db, 'Establishment Report', docId), {
      _type: 'entry',
      staffId,
      date: dateStr,
      month: prefix,
      status,
      updatedAt: new Date().toISOString()
    });
    showSave('saved');
  } catch(e) {
    console.error(e);
    showSave('error');
    toast('Save failed', true);
  }
}

async function saveStaffMember(id, name) {
  try {
    await setDoc(doc(db, 'Establishment Report', id), {
      _type: 'staff',
      name,
      createdAt: new Date().toISOString()
    });
  } catch(e) {
    console.error(e);
    toast('Error saving staff', true);
  }
}

async function deleteStaffMember(id) {
  try {
    await deleteDoc(doc(db, 'Establishment Report', id));
  } catch(e) {
    console.error(e);
  }
}

// ── Navigation ────────────────────────────────────────────────────────────
function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  if (viewMonth < 1)  { viewMonth = 12; viewYear--; }
  // Clear entries for fresh load
  staff.forEach(s => { entries[s.id] = {}; });
  showLoading(true);
  loadEntriesForMonth(viewYear, viewMonth).then(() => {
    showLoading(false);
    renderGrid();
  });
}

function goToday() {
  const n = new Date();
  viewYear  = n.getFullYear();
  viewMonth = n.getMonth() + 1;
  staff.forEach(s => { entries[s.id] = {}; });
  showLoading(true);
  loadEntriesForMonth(viewYear, viewMonth).then(() => {
    showLoading(false);
    renderGrid();
    // Scroll to today column
    setTimeout(() => {
      const todayEl = document.querySelector('.th-day-inner.today');
      if (todayEl) todayEl.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
    }, 100);
  });
}

// ── Render ────────────────────────────────────────────────────────────────
function renderGrid() {
  const days = daysInMonth(viewYear, viewMonth);
  const todayStr = dateKey(now.getFullYear(), now.getMonth()+1, now.getDate());

  monthLabel.textContent = new Date(viewYear, viewMonth-1, 1)
    .toLocaleDateString('en-GB', { month:'long', year:'numeric' });

  const filtered = staff.filter(s => !searchQ || s.name.toLowerCase().includes(searchQ));

  if (filtered.length === 0) {
    reportTable.style.display = 'none';
    emptyState.style.display  = 'flex';
    return;
  }
  emptyState.style.display  = 'none';
  reportTable.style.display = 'table';

  // ── Header ──
  let headHTML = '<tr>';
  headHTML += `<th class="col-staff"><div class="th-staff-inner"><div class="th-staff-label">Staff</div><div class="th-staff-count">${filtered.length}</div></div></th>`;
  for (let d = 1; d <= days; d++) {
    const key = dateKey(viewYear, viewMonth, d);
    const wknd = isWeekend(viewYear, viewMonth, d);
    const bh   = isBankHoliday(key);
    const isToday = key === todayStr;
    let cls = '';
    if (wknd || bh) cls = 'weekend';
    if (isToday)    cls = 'today';
    headHTML += `<th><div class="th-day-inner ${cls}"><div class="th-day-name">${dayName(viewYear, viewMonth, d)}</div><div class="th-day-num">${d}</div></div></th>`;
  }
  headHTML += '</tr>';
  tableHead.innerHTML = headHTML;

  // ── Body ──
  let bodyHTML = '';
  filtered.forEach(s => {
    const initials = s.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
    bodyHTML += `<tr data-staff-id="${s.id}">`;
    bodyHTML += `<td class="col-staff"><div class="td-staff"><div class="staff-avatar">${initials}</div><span class="staff-name" title="${esc(s.name)}">${esc(s.name)}</span></div></td>`;

    for (let d = 1; d <= days; d++) {
      const key  = dateKey(viewYear, viewMonth, d);
      const wknd = isWeekend(viewYear, viewMonth, d);
      const bh   = isBankHoliday(key);
      const isToday = key === todayStr;

      if (wknd) {
        bodyHTML += `<td class="cell-wknd"></td>`;
        continue;
      }

      let status, abbr, cls;
      if (bh) {
        status = 'Holiday'; abbr = 'BH'; cls = 's-BH';
      } else {
        const stored = entries[s.id]?.[key];
        const opt = STATUS_OPTIONS.find(o => o.code === stored) || STATUS_OPTIONS[0];
        status = opt.code; abbr = opt.abbr; cls = opt.cls;
      }

      const todayCls = isToday ? 'cell-today' : '';
      bodyHTML += `<td class="cell-day ${todayCls}" data-date="${key}" data-staff="${s.id}" data-bh="${bh?'1':'0'}">
        <span class="cell-chip ${cls}">${abbr}</span>
      </td>`;
    }
    bodyHTML += '</tr>';
  });
  tableBody.innerHTML = bodyHTML;

  // ── Footer totals ──
  let footHTML = '<tr class="totals-row">';
  footHTML += `<td class="col-staff">Summary</td>`;
  for (let d = 1; d <= days; d++) {
    const key  = dateKey(viewYear, viewMonth, d);
    const wknd = isWeekend(viewYear, viewMonth, d);
    const bh   = isBankHoliday(key);
    if (wknd) { footHTML += `<td></td>`; continue; }
    if (bh)   { footHTML += `<td style="color:var(--cell-hol-text);">BH</td>`; continue; }
    // Count people "In"
    const inCount = filtered.filter(s => {
      const st = entries[s.id]?.[key];
      return !st || st === 'In';
    }).length;
    const pct = filtered.length ? Math.round(inCount/filtered.length*100) : 0;
    const col = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';
    footHTML += `<td style="color:${col};font-size:10px;">${inCount}</td>`;
  }
  footHTML += '</tr>';
  tableFoot.innerHTML = footHTML;

  // ── Attach cell click listeners ──
  tableBody.querySelectorAll('.cell-day[data-bh="0"]').forEach(cell => {
    cell.addEventListener('click', onCellClick);
  });
}

// ── Cell click → popup ────────────────────────────────────────────────────
function onCellClick(e) {
  e.stopPropagation();
  const cell = e.currentTarget;
  const dateStr = cell.dataset.date;
  const staffId = cell.dataset.staff;

  // Position popup
  const rect = cell.getBoundingClientRect();
  cellPopup.style.display = 'block';
  // Build options
  const currentStatus = entries[staffId]?.[dateStr] || 'In';
  let html = `<div class="popup-header">${dateStr}</div>`;
  STATUS_OPTIONS.forEach(opt => {
    const active = opt.code === currentStatus ? 'style="background:var(--bg);"' : '';
    html += `<div class="popup-option" data-code="${opt.code}" data-staff="${staffId}" data-date="${dateStr}" ${active}>
      <div class="popup-dot ${opt.cls}">${opt.abbr}</div>
      <span>${opt.label}</span>
      ${opt.code === currentStatus ? '<span style="margin-left:auto;font-size:10px;color:var(--accent)">✓</span>' : ''}
    </div>`;
  });
  cellPopup.innerHTML = html;

  // Smart positioning
  const popW = 168, popH = STATUS_OPTIONS.length * 36 + 36;
  const vw = window.innerWidth, vh = window.innerHeight;
  let top  = rect.bottom + 4;
  let left = rect.left;
  if (top + popH > vh)  top  = rect.top - popH - 4;
  if (left + popW > vw) left = vw - popW - 8;
  if (left < 4)         left = 4;
  cellPopup.style.top  = `${top + window.scrollY}px`;
  cellPopup.style.left = `${left}px`;
  cellPopup.style.position = 'fixed';
  cellPopup.style.top  = `${top}px`;

  cellPopup.querySelectorAll('.popup-option').forEach(opt => {
    opt.addEventListener('click', async e2 => {
      e2.stopPropagation();
      const code = opt.dataset.code;
      const sid  = opt.dataset.staff;
      const dt   = opt.dataset.date;
      if (!entries[sid]) entries[sid] = {};
      entries[sid][dt] = code;
      cellPopup.style.display = 'none';
      renderGrid();
      await saveEntry(sid, dt, code);
    });
  });
}

function handleDocClick() { cellPopup.style.display = 'none'; }

// ── Add staff ─────────────────────────────────────────────────────────────
async function promptAddStaff() {
  const name = prompt('Enter staff member name:');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (staff.some(s => s.name.toLowerCase() === trimmed.toLowerCase())) {
    toast('Staff member already exists'); return;
  }
  const id = 'staff_' + Date.now();
  staff.push({ id, name: trimmed });
  entries[id] = {};
  staff.sort((a,b) => a.name.localeCompare(b.name));
  await saveStaffMember(id, trimmed);
  renderGrid();
  toast(`${trimmed} added`);
}

// ── UI helpers ────────────────────────────────────────────────────────────
function showLoading(show) {
  loadingOverlay.classList.toggle('hidden', !show);
}

let savePillTimer;
function showSave(state) {
  savePill.className = `save-pill show ${state}`;
  savePillText.textContent = state === 'saving' ? 'Saving…' : state === 'saved' ? 'Saved ✓' : 'Error saving';
  clearTimeout(savePillTimer);
  if (state !== 'saving') {
    savePillTimer = setTimeout(() => { savePill.classList.remove('show'); }, 2500);
  }
}

let toastTimer;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = isError ? 'var(--red)' : 'var(--border)';
  el.style.color = isError ? 'var(--red)' : 'var(--text)';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
