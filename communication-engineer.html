<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Energise — Engineer Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --bg: #141820;
      --surface: #1e2530;
      --surface2: #252d3a;
      --border: #2e3a4e;
      --accent: #d4f53c;
      --accent2: #47c8ff;
      --text: #f0f4ff;
      --text-muted: #8899aa;
      --in-stock: #4ade80;
      --out: #f87171;
      --warning: #fbbf24;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; min-height: 100vh; }

    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 20px 32px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .header-badge {
      background: rgba(212,245,60,0.12); border: 1px solid rgba(212,245,60,0.25);
      color: var(--accent); padding: 5px 14px; border-radius: 20px;
      font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.05em;
    }
    .header-right { display: flex; align-items: center; gap: 14px; }

    .page { max-width: 1280px; margin: 0 auto; padding: 28px 32px; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 24px 28px; margin-bottom: 28px; position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .card-title {
      font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .card-title svg { color: var(--accent); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-label {
      font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
    }
    .form-input, .form-select, .form-textarea {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 10px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; width: 100%; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 2px rgba(212,245,60,0.12);
    }
    .form-select option { background: var(--surface); }

    .btn {
      background: var(--accent); color: #000; border: none;
      padding: 10px 20px; border-radius: var(--radius);
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s, transform 0.1s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { background: #d4eb30; transform: translateY(-1px); }
    .btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; transform: none; }

    .btn-outline {
      background: transparent; color: var(--text); border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--accent2); color: var(--accent2); }

    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 2px solid var(--accent); }
    th {
      font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
      padding: 14px 16px; text-align: left; background: var(--surface);
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    td { padding: 14px 16px; vertical-align: middle; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 12px;
      font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; white-space: nowrap;
    }
    .badge-pending { background: rgba(251,191,36,0.12); color: var(--warning); }
    .badge-accepted { background: rgba(74,222,128,0.12); color: var(--in-stock); }
    .badge-challenged { background: rgba(248,113,113,0.12); color: var(--out); }
    .badge-closed { background: rgba(71,200,255,0.12); color: var(--accent2); }

    .radio-group { display: flex; gap: 16px; }
    .radio-label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    .upload-box {
      border: 2px dashed var(--border); border-radius: var(--radius); padding: 20px;
      text-align: center; color: var(--text-muted); cursor: pointer; transition: border-color 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .upload-box:hover { border-color: var(--accent2); background: rgba(71,200,255,0.05); }
    .upload-box input { display: none; }

    .files-list { margin-top: 10px; font-family: 'DM Mono', monospace; font-size: 12px; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 200; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      width: 500px; max-width: 95vw; padding: 28px;
    }
    .modal h3 { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 16px; }
    .modal-body { font-size: 14px; margin-bottom: 22px; color: var(--text-muted); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* Image Lightbox Modal */
    .image-modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      z-index: 9999; align-items: center; justify-content: center; padding: 20px;
    }
    .image-modal-overlay.open { display: flex; }
    .image-modal-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .image-modal-close {
      position: absolute; top: 20px; right: 30px; color: #fff; font-size: 30px;
      font-family: sans-serif; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .read-only-field {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 10px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">energise<span>.</span></div>
    <div class="header-right">
      <span class="header-badge">Engineer: Communication Review</span>
    </div>
  </header>

  <div class="page">
    <div id="noCommMessage" style="display: none; text-align: center; padding: 40px; color: var(--text-muted);">
      <h3>No communication selected.</h3>
      <p>Please use the link provided by your Team Leader to access your review.</p>
    </div>

    <div class="grid-2" id="commContent" style="display: none;">
      <!-- Read Only Details -->
      <div class="card">
        <div class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Communication Details
        </div>
        
        <div class="form-group">
          <label class="form-label">Date</label>
          <div class="read-only-field" id="roDate"></div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Manager</label>
            <div class="read-only-field" id="roManager"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Coaching Point</label>
            <div class="read-only-field" id="roPoint"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Revisit Required?</label>
          <div class="read-only-field" id="roRevisit"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Manager Comments</label>
          <div class="read-only-field" id="roComments" style="min-height: 80px; white-space: pre-wrap;"></div>
        </div>
        <div class="form-group" id="roImagesContainer">
          <label class="form-label">Attached Images</label>
          <div class="read-only-field" id="roImages" style="font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent2);"></div>
        </div>
      </div>

      <!-- Engineer Response -->
      <div class="card">
        <div class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          Your Acknowledgement
        </div>
        
        <div id="alreadySubmittedMessage" style="display: none; margin-bottom: 20px; padding: 15px; background: rgba(74,222,128,0.1); border: 1px solid var(--in-stock); border-radius: var(--radius); color: var(--in-stock);">
          ✓ You have already acknowledged this communication.
        </div>

        <form id="responseForm">
          <div class="form-group">
            <label class="form-label">Status <span style="color: var(--out);">*</span></label>
            <select id="engStatus" class="form-select" required>
              <option value="">Select an option...</option>
              <option value="Accepted">Accepted</option>
              <option value="Challenged">Challenged</option>
              <option value="Challenge closed">Challenge closed</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Your Comments</label>
            <textarea id="engComments" class="form-textarea" placeholder="Add any comments or questions here..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Digital Signature (Type your full name) <span style="color: var(--out);">*</span></label>
            <input type="text" id="engSignature" class="form-input" required placeholder="John Doe">
          </div>

          <button type="submit" class="btn" id="submitResponseBtn" style="width: 100%;">
            Submit Acknowledgement
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Image Modal / Lightbox -->
  <div class="image-modal-overlay" id="imageModal" onclick="this.classList.remove('open')">
    <div class="image-modal-close">&times;</div>
    <img id="imageModalImg" src="" onclick="event.stopPropagation()">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, serverTimestamp, query, orderBy } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
      authDomain: "oesperformance-a54c0.firebaseapp.com",
      projectId: "oesperformance-a54c0",
      storageBucket: "oesperformance-a54c0.firebasestorage.app",
      messagingSenderId: "484894102454",
      appId: "1:484894102454:web:17535ee497eac2d90d6717",
      measurementId: "G-R56BGZYV8N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function getCommunications() {
      try {
        const q = query(collection(db, "communication-submissions"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        const comms = [];
        querySnapshot.forEach((doc) => {
          comms.push({ id: doc.id, ...doc.data() });
        });
        return comms;
      } catch (e) {
        console.error("Error getting documents: ", e);
        return [];
      }
    }

    async function updateCommunication(id, data) {
      try {
        const docRef = doc(db, "communication-submissions", id);
        await updateDoc(docRef, data);
      } catch (e) {
        console.error("Error updating document: ", e);
        throw e;
      }
    }

    window.openImage = function(base64Str) {
      document.getElementById('imageModalImg').src = base64Str;
      document.getElementById('imageModal').classList.add('open');
    };

    let currentCommId = null;

    async function loadCommunication() {
      const urlParams = new URLSearchParams(window.location.search);
      currentCommId = urlParams.get('id');

      if (!currentCommId) {
        document.getElementById('noCommMessage').style.display = 'block';
        return;
      }

      // Fetch all to find the specific one (for simplicity in this mockup)
      const comms = await getCommunications();
      const comm = comms.find(c => c.id === currentCommId);

      if (!comm) {
        document.getElementById('noCommMessage').innerHTML = '<h3>Communication not found.</h3><p>The link might be invalid.</p>';
        document.getElementById('noCommMessage').style.display = 'block';
        return;
      }

      document.getElementById('commContent').style.display = 'grid';

      // Populate Read-Only Fields
      document.getElementById('roDate').innerText = comm.date;
      document.getElementById('roManager').innerText = comm.manager;
      document.getElementById('roPoint').innerText = comm.coachingPoint;
      document.getElementById('roRevisit').innerText = comm.revisit;
      document.getElementById('roComments').innerText = comm.managerComments;

      if (comm.images && comm.images.length > 0) {
        // Store images in global variable to avoid large strings in inline handlers
        window._currentCommImgs = comm.images;
        document.getElementById('roImages').innerHTML = comm.images.map((img, idx) => 
          `<a href="#" onclick="event.preventDefault(); window.openImage(window._currentCommImgs[${idx}].data);" style="color:var(--accent2); display:block; margin-bottom:5px;">📎 ${img.name}</a>`
        ).join('');
      } else {
        document.getElementById('roImagesContainer').style.display = 'none';
      }

      // If already acknowledged
      if (comm.status !== 'Pending') {
        document.getElementById('alreadySubmittedMessage').style.display = 'block';
        document.getElementById('engStatus').value = comm.status;
        document.getElementById('engComments').value = comm.engineerComments || '';
        document.getElementById('engSignature').value = comm.signature || '';
        
        // Disable form
        document.getElementById('engStatus').disabled = true;
        document.getElementById('engComments').disabled = true;
        document.getElementById('engSignature').disabled = true;
        document.getElementById('submitResponseBtn').style.display = 'none';
      }
    }

    document.getElementById('responseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitResponseBtn');
      btn.disabled = true;
      btn.innerText = 'Submitting...';

      const data = {
        status: document.getElementById('engStatus').value,
        engineerComments: document.getElementById('engComments').value,
        signature: document.getElementById('engSignature').value
      };

      try {
        await updateCommunication(currentCommId, data);
        alert('Response submitted successfully!');
        window.location.reload();
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Submit Acknowledgement';
      }
    });

    window.onload = loadCommunication;
  </script>
</body>
</html>
