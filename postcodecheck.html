<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postcode Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --white: #ffffff;
  --off: #f7f6f3;
  --stone: #e8e5df;
  --mid: #b0aa9e;
  --muted: #7a7268;
  --ink: #1c1a17;
  --ink-soft: #3d3a34;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05);
  --radius: 14px;
  --radius-sm: 9px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--off);
  color: var(--ink);
  font-family: 'Geist Mono', monospace;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 60% 40% at 15% -5%, rgba(45,122,79,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 105%, rgba(30,79,168,0.06) 0%, transparent 60%);
}

/* HEADER */
.page-header {
  background: var(--white);
  border-bottom: 1px solid var(--stone);
  padding: 20px 36px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.logo-mark {
  width: 40px; height: 40px;
  background: var(--ink);
  border-radius: 10px;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.logo-mark svg { width: 20px; height: 20px; }

.header-text h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 1.35rem;
  font-weight: 400;
  color: var(--ink);
  line-height: 1;
  letter-spacing: -0.01em;
}
.header-text p {
  font-size: 0.69rem;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: 0.04em;
}

/* MAIN */
.main {
  max-width: 820px;
  margin: 0 auto;
  padding: 36px 20px 80px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* CARD */
.card {
  background: var(--white);
  border: 1px solid var(--stone);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.card-header {
  padding: 16px 20px 13px;
  border-bottom: 1px solid var(--stone);
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-label {
  font-size: 0.67rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.step-badge {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--white);
  font-size: 0.63rem;
  display: grid; place-items: center;
  flex-shrink: 0;
}

/* UPLOAD ZONE */
.upload-zone {
  position: relative;
  padding: 32px 24px;
  text-align: center;
  cursor: pointer;
  transition: background 0.18s;
}
.upload-zone:hover { background: var(--off); }
.upload-zone.drag-over { background: #eaf5ee; }
.upload-zone input[type="file"] {
  position: absolute; inset: 0;
  opacity: 0; cursor: pointer;
  width: 100%; height: 100%;
}
.upload-icon-wrap {
  width: 54px; height: 54px;
  background: var(--off);
  border: 1.5px dashed var(--mid);
  border-radius: 13px;
  display: grid; place-items: center;
  margin: 0 auto 13px;
  transition: border-color 0.18s, background 0.18s;
}
.upload-zone:hover .upload-icon-wrap,
.upload-zone.drag-over .upload-icon-wrap {
  border-color: #2d7a4f;
  background: #eaf5ee;
}
.upload-icon-wrap svg {
  width: 22px; height: 22px;
  color: var(--muted);
  transition: color 0.18s;
}
.upload-zone:hover .upload-icon-wrap svg,
.upload-zone.drag-over .upload-icon-wrap svg { color: #2d7a4f; }

.upload-cta {
  font-size: 0.83rem;
  color: var(--ink-soft);
  margin-bottom: 4px;
}
.upload-cta strong { color: var(--ink); font-weight: 500; }
.upload-hint { font-size: 0.7rem; color: var(--mid); }

/* OR DIVIDER */
.or-divider {
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px 16px;
}
.or-divider::before, .or-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--stone);
}
.or-divider span {
  font-size: 0.67rem; letter-spacing: 0.08em;
  color: var(--mid); text-transform: uppercase;
}

/* TEXTAREA */
.paste-zone { padding: 0 20px 20px; }
textarea {
  width: 100%;
  min-height: 110px;
  background: var(--off);
  border: 1px solid var(--stone);
  border-radius: var(--radius-sm);
  padding: 13px 15px;
  font-family: 'Geist Mono', monospace;
  font-size: 0.8rem;
  color: var(--ink);
  resize: vertical;
  outline: none;
  transition: border-color 0.18s, box-shadow 0.18s;
  line-height: 1.85;
}
textarea:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(28,26,23,0.06);
}
textarea::placeholder { color: var(--mid); }

/* BUTTON */
.run-btn {
  background: var(--ink);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  padding: 15px 28px;
  font-family: 'Geist Mono', monospace;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  cursor: pointer;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  box-shadow: var(--shadow-sm);
}
.run-btn:hover {
  background: #2e2c28;
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.run-btn:active { transform: translateY(0); }
.run-btn svg { width: 15px; height: 15px; }

/* SUMMARY */
#summary { display: none; }

.summary-grid { padding: 18px 20px; display: grid; gap: 8px; }

.county-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 11px 14px;
  background: var(--off);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: border-color 0.15s;
  animation: slideUp 0.35s ease both;
}
.county-row:hover { border-color: var(--stone); }

.county-row-left { display: grid; gap: 6px; }

.county-name-row {
  display: flex; align-items: center; gap: 8px;
}
.county-dot {
  width: 8px; height: 8px;
  border-radius: 50%; flex-shrink: 0;
}
.county-name-text {
  font-size: 0.81rem;
  color: var(--ink);
}
.county-name-text.is-unknown { color: #b53a3a; font-style: italic; }

.bar-track {
  height: 4px;
  background: var(--stone);
  border-radius: 99px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  width: 0%;
  transition: width 0.95s cubic-bezier(0.16,1,0.3,1);
}

.county-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 36px; height: 26px;
  padding: 0 10px;
  border-radius: 99px;
  font-size: 0.73rem;
  font-weight: 500;
}

/* Color set */
.c0{background:#2d7a4f}.c1{background:#1e4fa8}.c2{background:#7a3ba8}
.c3{background:#c47a1e}.c4{background:#1e7a8c}.c5{background:#5a8c1e}
.c6{background:#8c4a1e}.c7{background:#5a1e7a}.c8{background:#a85a1e}.c9{background:#1e6ea8}

.p0{background:#eaf5ee;color:#2d7a4f}.p1{background:#edf2fc;color:#1e4fa8}
.p2{background:#f4edfb;color:#7a3ba8}.p3{background:#fdf4e7;color:#c47a1e}
.p4{background:#edf8fb;color:#1e7a8c}.p5{background:#f2f7e8;color:#5a8c1e}
.p6{background:#faf1eb;color:#8c4a1e}.p7{background:#f0e8fa;color:#5a1e7a}
.p8{background:#fdf1ea;color:#a85a1e}.p9{background:#e8f3fc;color:#1e6ea8}
.pu{background:#fdf0f0;color:#b53a3a}

/* STATS */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid var(--stone);
}
.stat-box {
  text-align: center;
  padding: 12px 8px;
  background: var(--off);
  border-radius: var(--radius-sm);
}
.stat-num {
  font-family: 'Instrument Serif', serif;
  font-size: 1.75rem;
  line-height: 1;
  color: var(--ink);
}
.stat-label {
  font-size: 0.63rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 4px;
}

/* RESULTS */
#results { display: none; }
.table-wrap { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; }
thead tr {
  background: var(--off);
  border-bottom: 1px solid var(--stone);
}
th {
  padding: 10px 18px;
  text-align: left;
  font-size: 0.63rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
tbody tr {
  border-bottom: 1px solid var(--stone);
  transition: background 0.1s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--off); }
td {
  padding: 10px 18px;
  font-size: 0.79rem;
  color: var(--ink-soft);
}
.td-postcode {
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.04em;
}
.td-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 0.7rem;
  font-weight: 500;
  background: var(--off);
  color: var(--muted);
  border: 1px solid var(--stone);
}
.td-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 0.73rem;
}
.td-chip-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  opacity: 0.7;
  background: currentColor;
  flex-shrink: 0;
}
.unknown-row { opacity: 0.65; }

.table-footer {
  padding: 13px 20px;
  border-top: 1px solid var(--stone);
  background: var(--off);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.table-footer-text {
  font-size: 0.7rem;
  color: var(--muted);
}
.table-footer-text span { color: var(--ink); font-weight: 500; }

/* EXPORT BUTTONS */
.export-group {
  display: flex;
  gap: 7px;
  align-items: center;
}
.export-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--stone);
  background: var(--white);
  color: var(--ink-soft);
  font-family: 'Geist Mono', monospace;
  font-size: 0.69rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.14s, border-color 0.14s, color 0.14s, transform 0.1s, box-shadow 0.14s;
}
.export-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
.export-btn:hover {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--white);
  box-shadow: var(--shadow-sm);
  transform: translateY(-1px);
}
.export-btn:active { transform: translateY(0); }

.export-btn.flash {
  background: #2d7a4f;
  border-color: #2d7a4f;
  color: var(--white);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 580px) {
  .page-header { padding: 16px; }
  .main { padding: 20px 12px 60px; }
  .table-footer { flex-direction: column; align-items: flex-start; gap: 10px; }
}
</style>
</head>
<body>

<header class="page-header">
  <div class="logo-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
      <circle cx="12" cy="9" r="2.5" fill="white" stroke="none"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>Postcode Checker</h1>
    <p>Upload postcodes · see county breakdown</p>
  </div>
</header>

<main class="main">

  <!-- Input -->
  <div class="card">
    <div class="card-header">
      <div class="step-badge">1</div>
      <span class="card-label">Upload or paste your postcodes</span>
    </div>
    <div class="upload-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".txt,.csv">
      <div class="upload-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="upload-cta"><strong>Drop a file here</strong> or click to browse</p>
      <p class="upload-hint">.txt or .csv &nbsp;·&nbsp; one postcode per line</p>
    </div>
    <div class="or-divider"><span>or paste below</span></div>
    <div class="paste-zone">
      <textarea id="pasteInput" placeholder="SW1A 1AA&#10;M1 1AE&#10;EH1 1YZ&#10;BS1 4DJ&#10;..."></textarea>
    </div>
  </div>

  <!-- Run -->
  <button class="run-btn" id="checkBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    Check Postcodes
  </button>

  <!-- Summary -->
  <div class="card" id="summary">
    <div class="card-header">
      <div class="step-badge">2</div>
      <span class="card-label">County breakdown — ranked by quantity</span>
    </div>
    <div class="summary-grid" id="summaryBars"></div>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <!-- Results -->
  <div class="card" id="results">
    <div class="card-header">
      <div class="step-badge">3</div>
      <span class="card-label">Full results</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Postcode</th>
            <th>Area Code</th>
            <th>County / Region</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="table-footer">
      <div class="table-footer-text" id="tableFooterText"></div>
      <div class="export-group">
        <button class="export-btn" id="exportCsvBtn" title="Export full results as CSV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          CSV
        </button>
        <button class="export-btn" id="exportSummaryBtn" title="Export county summary as CSV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Summary CSV
        </button>
        <button class="export-btn" id="exportTxtBtn" title="Export postcodes as plain text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          TXT
        </button>
      </div>
    </div>
  </div>

</main>

<script>
const postcodeMap = {
  AB:"Aberdeen City / Aberdeenshire",AL:"Hertfordshire",B:"West Midlands",BA:"Somerset",
  BB:"Lancashire",BD:"West Yorkshire",BH:"Dorset",BL:"Greater Manchester",BN:"East Sussex",
  BR:"Greater London",BS:"Bristol / Somerset",BT:"Northern Ireland",CA:"Cumbria",
  CB:"Cambridgeshire",CF:"Cardiff / South Wales",CH:"Cheshire",CM:"Essex",CO:"Essex",
  CR:"Greater London / Surrey",CT:"Kent",CV:"West Midlands / Warwickshire",CW:"Cheshire",
  DA:"Greater London / Kent",DD:"Dundee / Angus",DE:"Derbyshire",DG:"Dumfries & Galloway",
  DH:"County Durham",DL:"County Durham / North Yorkshire",DN:"South Yorkshire / Lincolnshire",
  DT:"Dorset",DY:"West Midlands / Worcestershire",E:"Greater London",EC:"Greater London (City)",
  EH:"Edinburgh / Lothian",EN:"Hertfordshire / Greater London",EX:"Devon",
  FK:"Stirling / Falkirk",FY:"Lancashire",G:"Glasgow",GL:"Gloucestershire",
  GU:"Surrey / Hampshire",GY:"Guernsey",HA:"Greater London",HD:"West Yorkshire",
  HG:"North Yorkshire",HP:"Hertfordshire / Buckinghamshire",HR:"Herefordshire",
  HS:"Western Isles",HU:"East Yorkshire",HX:"West Yorkshire",IG:"Greater London / Essex",
  IM:"Isle of Man",IP:"Suffolk",IV:"Inverness-shire / Highland",JE:"Jersey",KA:"Ayrshire",
  KT:"Surrey",KW:"Caithness / Highland",KY:"Fife / Kinross",L:"Merseyside",
  LA:"Lancashire / Cumbria",LD:"Powys",LE:"Leicestershire",LL:"North Wales",
  LN:"Lincolnshire",LS:"West Yorkshire",LU:"Bedfordshire",M:"Greater Manchester",
  ME:"Kent",MK:"Buckinghamshire / Milton Keynes",ML:"North Lanarkshire",N:"Greater London",
  NE:"Tyne & Wear / Northumberland",NG:"Nottinghamshire",NN:"Northamptonshire",
  NP:"Newport / South Wales",NR:"Norfolk",NW:"Greater London",OL:"Greater Manchester",
  OX:"Oxfordshire",PA:"Renfrewshire / Argyll",PE:"Cambridgeshire / Lincolnshire",
  PH:"Perthshire / Highland",PL:"Devon / Cornwall",PO:"Hampshire / Isle of Wight",
  PR:"Lancashire",RG:"Berkshire / Hampshire",RH:"Surrey / West Sussex",RM:"Greater London / Essex",
  S:"South Yorkshire",SA:"Swansea / West Wales",SE:"Greater London",SG:"Hertfordshire",
  SK:"Cheshire / Greater Manchester",SL:"Berkshire / Buckinghamshire",
  SM:"Greater London / Surrey",SN:"Wiltshire",SO:"Hampshire",SP:"Wiltshire / Hampshire",
  SR:"Tyne & Wear",SS:"Essex",ST:"Staffordshire",SW:"Greater London",
  SY:"Shropshire / Wales",TA:"Somerset",TD:"Scottish Borders",TF:"Shropshire / Telford",
  TN:"Kent / East Sussex",TQ:"Devon",TR:"Cornwall",TS:"Teesside / Cleveland",
  TW:"Greater London / Surrey",UB:"Greater London",W:"Greater London",
  WA:"Cheshire / Merseyside",WC:"Greater London (City)",WD:"Hertfordshire",
  WF:"West Yorkshire",WN:"Greater Manchester",WR:"Worcestershire",WS:"West Midlands",
  WV:"West Midlands",YO:"North Yorkshire",ZE:"Shetland"
};

// Store results globally for export
let _results = [];
let _sortedCounts = [];

function getCounty(postcode) {
  const clean = postcode.trim().toUpperCase().replace(/\s+/g,'');
  if (!clean) return null;
  const prefix2 = clean.match(/^([A-Z]{1,2})/)?.[1] || '';
  if (prefix2.length === 2 && postcodeMap[prefix2]) return { county: postcodeMap[prefix2], area: prefix2 };
  if (prefix2.length >= 1 && postcodeMap[prefix2[0]]) return { county: postcodeMap[prefix2[0]], area: prefix2[0] };
  return { county: "Unknown", area: prefix2 || clean };
}

function parsePostcodes(text) {
  return text.split(/[\n,;\t]+/).map(p => p.trim()).filter(p => p.length > 0);
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function flashBtn(btn) {
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 900);
}

function exportCSV() {
  if (!_results.length) return;
  const rows = [['Postcode', 'Area Code', 'County / Region']];
  _results.forEach(r => rows.push([r.postcode, r.area || '', r.county || 'Unknown']));
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  downloadFile(csv, 'postcode-results.csv', 'text/csv;charset=utf-8;');
  flashBtn(document.getElementById('exportCsvBtn'));
}

function exportSummaryCSV() {
  if (!_sortedCounts.length) return;
  const rows = [['County / Region', 'Count', 'Percentage']];
  const total = _results.length;
  _sortedCounts.forEach(([county, count]) => {
    rows.push([county, count, ((count / total) * 100).toFixed(1) + '%']);
  });
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  downloadFile(csv, 'postcode-summary.csv', 'text/csv;charset=utf-8;');
  flashBtn(document.getElementById('exportSummaryBtn'));
}

function exportTXT() {
  if (!_results.length) return;
  const lines = _results.map(r => `${r.postcode.padEnd(12)}${(r.area || '').padEnd(6)}${r.county || 'Unknown'}`);
  const header = `${'POSTCODE'.padEnd(12)}${'AREA'.padEnd(6)}COUNTY / REGION`;
  const divider = '─'.repeat(60);
  const txt = [header, divider, ...lines].join('\n');
  downloadFile(txt, 'postcode-results.txt', 'text/plain;charset=utf-8;');
  flashBtn(document.getElementById('exportTxtBtn'));
}

document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);
document.getElementById('exportSummaryBtn').addEventListener('click', exportSummaryCSV);
document.getElementById('exportTxtBtn').addEventListener('click', exportTXT);

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => document.getElementById('pasteInput').value = ev.target.result;
  r.readAsText(file);
});

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => document.getElementById('pasteInput').value = ev.target.result;
  r.readAsText(file);
});

document.getElementById('checkBtn').addEventListener('click', () => {
  const text = document.getElementById('pasteInput').value;
  const postcodes = parsePostcodes(text);
  if (!postcodes.length) return;

  _results = postcodes.map(pc => ({ postcode: pc, ...getCounty(pc) }));

  const counts = {};
  _results.forEach(r => { const k = r.county||"Unknown"; counts[k]=(counts[k]||0)+1; });
  _sortedCounts = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const maxCount = _sortedCounts[0]?.[1]||1;
  const total = _results.length;
  const known = _results.filter(r=>r.county!=='Unknown').length;
  const numCounties = _sortedCounts.filter(([c])=>c!=='Unknown').length;

  const colorMap = {};
  _sortedCounts.filter(([c])=>c!=='Unknown').forEach(([county],i)=>{ colorMap[county]=i%10; });

  // Summary bars
  const barsEl = document.getElementById('summaryBars');
  barsEl.innerHTML='';
  _sortedCounts.forEach(([county,count],idx)=>{
    const pct = (count/maxCount*100).toFixed(1);
    const ci = colorMap[county]!==undefined ? colorMap[county] : null;
    const isUnk = county==='Unknown';
    const div = document.createElement('div');
    div.className = 'county-row';
    div.style.animationDelay = (idx*0.045)+'s';
    div.innerHTML = `
      <div class="county-row-left">
        <div class="county-name-row">
          <div class="county-dot ${isUnk?'':'c'+ci}" style="${isUnk?'background:#b53a3a':''}"></div>
          <span class="county-name-text ${isUnk?'is-unknown':''}">${county}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill ${isUnk?'':'c'+ci}" style="${isUnk?'background:#b53a3a':''}" data-pct="${pct}"></div>
        </div>
      </div>
      <div class="county-pill ${isUnk?'pu':'p'+ci}">${count}</div>
    `;
    barsEl.appendChild(div);
  });

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">Postcodes</div></div>
    <div class="stat-box"><div class="stat-num">${numCounties}</div><div class="stat-label">Counties</div></div>
    <div class="stat-box"><div class="stat-num">${total>0?Math.round(known/total*100):0}%</div><div class="stat-label">Matched</div></div>
  `;

  const summaryEl = document.getElementById('summary');
  summaryEl.style.display = 'block';

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.bar-fill').forEach(el=>{ el.style.width = el.dataset.pct+'%'; });
  }));

  // Table
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML='';
  _results.forEach(r=>{
    const ci = colorMap[r.county]!==undefined ? colorMap[r.county] : null;
    const isUnk = r.county==='Unknown';
    const tr = document.createElement('tr');
    if (isUnk) tr.classList.add('unknown-row');
    tr.innerHTML = `
      <td class="td-postcode">${r.postcode}</td>
      <td><span class="td-badge">${r.area||'—'}</span></td>
      <td>${isUnk
        ? '<span class="td-chip pu"><span class="td-chip-dot"></span>Unknown</span>'
        : `<span class="td-chip p${ci}"><span class="td-chip-dot"></span>${r.county}</span>`
      }</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('tableFooterText').innerHTML =
    `Showing <span>${total}</span> postcodes across <span>${numCounties}</span> ${numCounties===1?'county':'counties'}`;

  document.getElementById('results').style.display = 'block';
  summaryEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
</body>
</html>
