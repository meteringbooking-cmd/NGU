<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <title>Communication Submission</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
    :root {
      --bg: #141820;
      --surface: #1e2530;
      --surface2: #252d3a;
      --border: #2e3a4e;
      --accent: #d4f53c;
      --accent2: #47c8ff;
      --text: #f0f4ff;
      --text-muted: #8899aa;
      --in-stock: #4ade80;
      --out: #f87171;
      --warning: #fbbf24;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 20px 32px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100; flex-shrink: 0;
    }
    .logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .header-badge {
      background: rgba(212,245,60,0.12); border: 1px solid rgba(212,245,60,0.25);
      color: var(--accent); padding: 5px 14px; border-radius: 20px;
      font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.05em;
    }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .page {
      flex: 1 1 auto; width: 100%; margin: 0 auto; padding: 28px 32px;
      display: flex; flex-direction: column; min-height: 0;
    }
    .grid-2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      flex: 1 1 auto; min-height: 0; align-items: stretch;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 24px 28px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; min-height: 0;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .card-title {
      font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .card-title svg { color: var(--accent); }
    #submissionForm {
      display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow-y: auto;
    }
    .grid-2 .grid-2 { flex: 0 0 auto; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group:has(.form-textarea) { flex: 1 1 auto; min-height: 0; }
    .form-textarea { flex: 1 1 auto; }
    .form-label {
      font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
    }
    .form-input, .form-select, .form-textarea {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 10px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; width: 100%; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 2px rgba(212,245,60,0.12);
    }
    .form-select option { background: var(--surface); }
    .btn {
      background: var(--accent); color: #000; border: none;
      padding: 10px 20px; border-radius: var(--radius);
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s, transform 0.1s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      flex-shrink: 0;
    }
    .btn:hover { background: #d4eb30; transform: translateY(-1px); }
    .btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; transform: none; }
    .btn-outline {
      background: transparent; color: var(--text); border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--accent2); color: var(--accent2); }
    .table-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 2px solid var(--accent); }
    th {
      font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
      padding: 14px 16px; text-align: left; background: var(--surface);
      position: sticky; top: 0; z-index: 1;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    td { padding: 14px 16px; vertical-align: middle; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 12px;
      font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; white-space: nowrap;
    }
    .badge-pending { background: rgba(251,191,36,0.12); color: var(--warning); }
    .badge-accepted { background: rgba(74,222,128,0.12); color: var(--in-stock); }
    .badge-challenged { background: rgba(248,113,113,0.12); color: var(--out); }
    .badge-closed { background: rgba(71,200,255,0.12); color: var(--accent2); }
    .radio-group { display: flex; gap: 16px; }
    .radio-label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .upload-box {
      border: 2px dashed var(--border); border-radius: var(--radius); padding: 20px;
      text-align: center; color: var(--text-muted); cursor: pointer; transition: border-color 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .upload-box:hover { border-color: var(--accent2); background: rgba(71,200,255,0.05); }
    .upload-box input { display: none; }
    .files-list { margin-top: 10px; font-family: 'DM Mono', monospace; font-size: 12px; }
    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 200; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      width: 500px; max-width: 95vw; padding: 28px;
    }
    .modal h3 { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 16px; }
    .modal-body { font-size: 14px; margin-bottom: 22px; color: var(--text-muted); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    /* Image Lightbox Modal */
    .image-modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      z-index: 9999; align-items: center; justify-content: center; padding: 20px;
    }
    .image-modal-overlay.open { display: flex; }
    .image-modal-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .image-modal-close {
      position: absolute; top: 20px; right: 30px; color: #fff; font-size: 30px;
      font-family: sans-serif; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
      .page { overflow-y: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Communication Hub<span>.</span></div>
    <div class="header-right">
      <span class="header-badge">Admin: Communication Portal</span>
    </div>
  </header>
  <div class="page">
    <div class="grid-2">
      <!-- Submission Form -->
      <div class="card">
        <div class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Submit Communication
        </div>
        <form id="submissionForm">
          <div class="form-group">
            <label class="form-label">Engineer Name</label>
            <input type="text" id="engName" class="form-input" required placeholder="e.g. John Doe">
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Date</label>
              <input type="date" id="commDate" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">Job Number</label>
              <input type="text" id="jobNumber" class="form-input" placeholder="e.g. JB-10234">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Manager</label>
            <select id="managerName" class="form-select" required>
              <option value="">Select Manager...</option>
              <option value="Richard Wiecko">Richard Wiecko</option>
              <option value="Scott Carson">Scott Carson</option>
              <option value="Stuart Whyte">Stuart Whyte</option>
              <option value="Thomas Green">Thomas Green</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Coaching Point</label>
            <select id="coachingPoint" class="form-select" required>
              <option value="">Select Point...</option>
              <option value="Audit fail">Audit fail</option>
              <option value="Complaint">Complaint</option>
              <option value="121">121</option>
              <option value="WIP Feedback">WIP Feedback</option>
              <option value="Recognition">Recognition</option>
              <option value="Training issue">Training issue</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Revisit Required?</label>
            <div class="radio-group">
              <label class="radio-label"><input type="radio" name="revisit" value="Yes" required> Yes</label>
              <label class="radio-label"><input type="radio" name="revisit" value="No"> No</label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Upload Images (Max 5)</label>
            <div class="upload-box" id="uploadBox">
              <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Click to select up to 5 images
              <input type="file" id="imageUpload" multiple accept="image/*">
            </div>
            <div id="fileList" class="files-list"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Manager Comments</label>
            <textarea id="managerComments" class="form-textarea" required placeholder="Enter details regarding this communication..."></textarea>
          </div>
          <button type="submit" class="btn" id="submitBtn" style="width:100%">
            Submit Communication
          </button>
        </form>
      </div>
      <!-- Overview -->
      <div class="card" style="grid-column: span 1;">
        <div class="card-title" style="justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            Recent Submissions
          </div>
          <a href="communication-historic.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px; text-decoration: none; border-radius: 4px;">View Historic</a>
        </div>
        <div class="table-wrap">
          <table id="submissionsTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Job #</th>
                <th>Engineer</th>
                <th>Point</th>
                <th>Status</th>
                <th>Images</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <!-- Image Modal / Lightbox -->
  <div class="image-modal-overlay" id="imageModal" onclick="this.classList.remove('open')">
    <div class="image-modal-close">&times;</div>
    <img id="imageModalImg" src="" onclick="event.stopPropagation()">
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, serverTimestamp, query, orderBy }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
      authDomain: "oesperformance-a54c0.firebaseapp.com",
      projectId: "oesperformance-a54c0",
      storageBucket: "oesperformance-a54c0.firebasestorage.app",
      messagingSenderId: "484894102454",
      appId: "1:484894102454:web:17535ee497eac2d90d6717",
      measurementId: "G-R56BGZYV8N"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    async function submitCommunication(data) {
      try {
        data.createdAt = serverTimestamp();
        data.status = 'Pending';
        const docRef = await addDoc(collection(db, "communication-submissions"), data);
        return docRef.id;
      } catch (e) {
        console.error("Error adding document: ", e);
        throw e;
      }
    }
    async function getCommunications() {
      try {
        const q = query(collection(db, "communication-submissions"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        const comms = [];
        querySnapshot.forEach((doc) => {
          comms.push({ id: doc.id, ...doc.data() });
        });
        return comms;
      } catch (e) {
        console.error("Error getting documents: ", e);
        return [];
      }
    }
    window.openImage = function(base64Str) {
      document.getElementById('imageModalImg').src = base64Str;
      document.getElementById('imageModal').classList.add('open');
    };
    // File Upload handling - uploads to Firebase Storage as soon as each file is selected
    const uploadBox = document.getElementById('uploadBox');
    const imageUpload = document.getElementById('imageUpload');
    const fileList = document.getElementById('fileList');
    let selectedFiles = []; // { id, name, status: 'uploading'|'done'|'error', progress, url, storagePath, task, promise }
    function renderFileList() {
      fileList.innerHTML = selectedFiles.map(f => {
        let statusHtml = '';
        if (f.status === 'uploading') {
          statusHtml = `<span style="color: var(--warning);">Uploading… ${f.progress || 0}%</span>`;
        } else if (f.status === 'done') {
          statusHtml = `<span style="color: var(--in-stock);">Uploaded</span>`;
        } else if (f.status === 'error') {
          statusHtml = `<span style="color: var(--out);">Failed</span>`;
        }
        return `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:5px 0;">
            <span>📎 ${f.name}</span>
            <span style="display:flex; align-items:center; gap:10px;">
              ${statusHtml}
              <span onclick="window.removeSelectedFile('${f.id}')" style="cursor:pointer; color: var(--out); font-weight:700;" title="Remove">✕</span>
            </span>
          </div>
        `;
      }).join('');
    }
    window.removeSelectedFile = async function(id) {
      const idx = selectedFiles.findIndex(f => f.id === id);
      if (idx === -1) return;
      const f = selectedFiles[idx];
      if (f.task && f.status === 'uploading') {
        try { f.task.cancel(); } catch (err) {}
      }
      if (f.status === 'done' && f.storagePath) {
        try { await deleteObject(ref(storage, f.storagePath)); }
        catch (err) { console.warn('Could not delete file from storage:', err); }
      }
      selectedFiles.splice(idx, 1);
      renderFileList();
    };
    function uploadFile(fileEntry, file) {
      const storagePath = `communication-images/${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${file.name}`;
      const storageRef = ref(storage, storagePath);
      const task = uploadBytesResumable(storageRef, file);
      fileEntry.task = task;
      fileEntry.storagePath = storagePath;
      fileEntry.promise = new Promise((resolve) => {
        task.on('state_changed',
          (snapshot) => {
            fileEntry.progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
            renderFileList();
          },
          (error) => {
            console.error('Upload failed:', error);
            fileEntry.status = 'error';
            renderFileList();
            resolve(null);
          },
          async () => {
            try {
              const url = await getDownloadURL(task.snapshot.ref);
              fileEntry.url = url;
              fileEntry.status = 'done';
              renderFileList();
              resolve({ name: file.name, url, path: storagePath });
            } catch (err) {
              console.error('Could not get download URL:', err);
              fileEntry.status = 'error';
              renderFileList();
              resolve(null);
            }
          }
        );
      });
    }
    uploadBox.addEventListener('click', () => imageUpload.click());
    imageUpload.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length + selectedFiles.length > 5) {
        alert('You can only upload up to 5 images.');
        imageUpload.value = '';
        return;
      }
      files.forEach(file => {
        const fileEntry = {
          id: Date.now() + '_' + Math.random().toString(36).slice(2, 8),
          name: file.name,
          status: 'uploading',
          progress: 0
        };
        selectedFiles.push(fileEntry);
        uploadFile(fileEntry, file);
      });
      renderFileList();
      imageUpload.value = ''; // allow re-selecting a file with the same name later
    });
    // Manager email lookup
    const managerEmails = {
      'Richard Wiecko': 'richard.wiecko@next-gen.uk',
      'Scott Carson': 'scott.carson@next-gen.uk',
      'Stuart Whyte': 'stuart.whyte@next-gen.uk',
      'Thomas Green': 'thomas.green@next-gen.uk'
    };
    // EmailJS init
    emailjs.init('ziLnha91scpGjFABh');
    async function sendManagerEmail(managerName, engineerName, coachingPoint, date, jobNumber) {
      const toEmail = managerEmails[managerName];
      if (!toEmail) return;
      await emailjs.send('service_8lgghpq', 'template_pv50ldd', {
        manager_name: managerName,
        to_email: toEmail,
        engineer_name: engineerName,
        coaching_point: coachingPoint,
        date: date,
        job_number: jobNumber,
        comms_hub_url: 'https://ngu-green.vercel.app/communication-review.html'
      });
    }
    // Form Submission
    document.getElementById('submissionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Submitting...';
      if (selectedFiles.some(f => f.status === 'uploading')) {
        btn.innerText = 'Finishing image upload...';
      }
      const uploadResults = await Promise.all(selectedFiles.map(f => f.promise || Promise.resolve(null)));
      const uploadedImages = uploadResults.filter(Boolean);
      const data = {
        engineerName: document.getElementById('engName').value,
        date: document.getElementById('commDate').value,
        jobNumber: document.getElementById('jobNumber').value,
        manager: document.getElementById('managerName').value,
        coachingPoint: document.getElementById('coachingPoint').value,
        revisit: document.querySelector('input[name="revisit"]:checked').value,
        managerComments: document.getElementById('managerComments').value,
        images: uploadedImages
      };
      try {
        await submitCommunication(data);
        // Send email notification to manager
        try {
          await sendManagerEmail(data.manager, data.engineerName, data.coachingPoint, data.date, data.jobNumber);
        } catch (emailErr) {
          console.warn('Email notification failed (submission still saved):', emailErr);
        }
        alert('Communication submitted successfully!');
        e.target.reset();
        selectedFiles = [];
        fileList.innerHTML = '';
        loadTable();
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Submit Communication';
      }
    });
    function getStatusBadge(status) {
      if (status === 'Accepted') return '<span class="badge badge-accepted">Accepted</span>';
      if (status === 'Challenged') return '<span class="badge badge-challenged">Challenged</span>';
      if (status === 'Challenge closed') return '<span class="badge badge-closed">Challenge Closed</span>';
      return '<span class="badge badge-pending">Pending</span>';
    }
    async function loadTable() {
      const tbody = document.getElementById('tableBody');
      const comms = await getCommunications();
      if (comms.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">No submissions found.</td></tr>';
        return;
      }
      tbody.innerHTML = comms.map((c, i) => {
        // Store images in a global object to avoid massive inline HTML strings
        window[`_commImgs_${i}`] = c.images || [];
        const imageLinks = (c.images || []).map((img, imgIdx) =>
          `<a href="#" onclick="event.stopPropagation(); window.openImage(window['_commImgs_${i}'][${imgIdx}].url); return false;" style="color:var(--accent2);margin-right:5px;">📎 ${img.name}</a>`
        ).join('');
        return `
          <tr style="cursor: pointer;" onclick="alert('Manager: ${c.manager}\\nComments: ${c.managerComments}\\n\\nEng Comments: ${c.engineerComments || 'N/A'}\\nSignature: ${c.signature || 'N/A'}')">
            <td>${c.date}</td>
            <td>${c.jobNumber || '<span style="color:var(--text-muted)">-</span>'}</td>
            <td style="font-weight: 500;">${c.engineerName}</td>
            <td>${c.coachingPoint}</td>
            <td>${getStatusBadge(c.status)}</td>
            <td>${imageLinks || '<span style="color:var(--text-muted)">None</span>'}</td>
          </tr>
        `;
      }).join('');
    }
    window.onload = () => {
      document.getElementById('commDate').valueAsDate = new Date();
      loadTable();
    };
  </script>
</body>
</html>
