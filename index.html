<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initiate Offboarding</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
[data-theme="dark"] {
  --bg:#0A1628; --bg2:#111f38; --bg3:#1a2942; --bg4:#0d1a2e;
  --border:#2a3f5f; --border2:#1e3050;
  --text:#E8EDF2; --muted:#7a8fa8; --faint:#2a3f5f;
  --surface:rgba(10,22,40,0.97);
  --accent:#00A3E0; --accent2:#005EB8;
}
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; background: var(--bg2); padding: 30px; border-radius: 10px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
h1 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 15px; color: var(--accent); }
.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--muted); }
input, select, button { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg3); color: var(--text); font-family: inherit; font-size: 16px; }
input[readonly] { background: var(--bg); color: var(--muted); cursor: not-allowed; }
button { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
button:hover { background: var(--accent2); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
#exitInterviewSection { display: none; padding: 15px; background: var(--bg3); border-radius: 6px; margin-top: 10px; border: 1px solid var(--border); }
</style>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getFirestore, collection, getDocs, addDoc, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
  import emailjs from 'https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js';
  
  emailjs.init("ziLnha91scpGjFABh");

  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let staffData = {};

  async function loadStaff() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Loading staff data...';
    try {
        const snap = await getDocs(collection(db, 'Establishment Report'));
        const select = document.getElementById('employeeSelect');
        snap.forEach(doc => {
            const data = doc.data();
            if (data._type === 'staff') {
                staffData[doc.id] = { id: doc.id, ...data };
                const option = document.createElement('option');
                option.value = doc.id;
                option.textContent = `${data.name} (${doc.id})`;
                select.appendChild(option);
            }
        });
        btn.disabled = false;
        btn.textContent = 'Initiate Offboarding';
    } catch (err) {
        console.error(err);
        alert('Failed to load employee database.');
    }
  }

  window.handleEmployeeSelect = function() {
      const id = document.getElementById('employeeSelect').value;
      if(!id) return;
      const emp = staffData[id];
      document.getElementById('empName').value = emp.name || '';
      document.getElementById('empNum').value = emp.id || '';
      document.getElementById('jobTitle').value = emp.jobTitle || '';
      document.getElementById('contract').value = emp.contract || '';
      document.getElementById('manager').value = emp.manager || '';
      document.getElementById('location').value = emp.postcode || '';
      document.getElementById('startDate').value = emp.createdAt || '';
  }

  window.toggleInterview = function() {
      const val = document.getElementById('exitInterview').value;
      document.getElementById('exitInterviewSection').style.display = val === 'yes' ? 'block' : 'none';
  }

  window.submitOffboarding = async function(e) {
      e.preventDefault();
      const id = document.getElementById('employeeSelect').value;
      if (!id) return alert('Please select an employee.');
      
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      const empName = document.getElementById('empName').value;
      const managerEmail = document.getElementById('managerEmail').value;
      const wantsInterview = document.getElementById('exitInterview').value === 'yes';

      try {
          const offboardData = {
              employeeId: id,
              name: empName,
              jobTitle: document.getElementById('jobTitle').value,
              contract: document.getElementById('contract').value,
              manager: document.getElementById('manager').value,
              location: document.getElementById('location').value,
              startDate: document.getElementById('startDate').value,
              exitInterviewRequested: wantsInterview,
              managerEmail: managerEmail,
              initiatedAt: new Date().toISOString()
          };

          const docRef = await addDoc(collection(db, "Offboarding Forms"), offboardData);
          const checklistId = docRef.id;

          // Also create empty checklist document with same ID
          await setDoc(doc(db, "offboarding checklist", checklistId), {
              employeeId: id,
              name: empName,
              initiatedAt: new Date().toISOString()
          });

          // 1. Send confirmation of resignation to leaver (Assuming we ask for their email? The prompt didn't say, let's prompt for personal email)
          const personalEmail = prompt(`Please enter ${empName}'s personal email address to send the resignation confirmation to:`);
          if (personalEmail) {
              await emailjs.send("service_hdd4x8i", "template_sv97s64", {
                  to_email: personalEmail,
                  employee_name: empName
              });
          }

          // 2. Notify departments with link to checklist portal
          const portalLink = window.location.href.replace('index.html', '') + `checklist.html?id=${checklistId}`;
          await emailjs.send("service_hdd4x8i", "template_r1ehsyt", {
              employee_name: empName,
              checklist_link: portalLink
          });

          // 3. Send exit interview booking to manager if requested
          if (wantsInterview && managerEmail) {
              const bookingLink = window.location.href.replace('index.html', '') + `book-exit-interview.html?id=${checklistId}`;
              await emailjs.send("service_hdd4x8i", "template_okr3omr", {
                  to_email: managerEmail,
                  employee_name: empName,
                  booking_link: bookingLink
              });
          }

          alert('Offboarding successfully initiated!');
          window.location.reload();
      } catch (err) {
          console.error(err);
          alert('Error processing offboarding.');
          btn.disabled = false;
          btn.textContent = 'Initiate Offboarding';
      }
  }

  loadStaff();
</script>
</head>
<body>
<div class="container">
    <h1>Initiate Employee Offboarding</h1>
    <form onsubmit="submitOffboarding(event)">
        <div class="form-group">
            <label>Select Staff Member</label>
            <select id="employeeSelect" onchange="handleEmployeeSelect()" required>
                <option value="">-- Start typing or select --</option>
            </select>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Employee Name</label>
                <input type="text" id="empName" readonly>
            </div>
            <div class="form-group">
                <label>Employee Number</label>
                <input type="text" id="empNum" readonly>
            </div>
            <div class="form-group">
                <label>Job Title</label>
                <input type="text" id="jobTitle" readonly>
            </div>
            <div class="form-group">
                <label>Contract</label>
                <input type="text" id="contract" readonly>
            </div>
            <div class="form-group">
                <label>Line Manager / FTM</label>
                <input type="text" id="manager" readonly>
            </div>
            <div class="form-group">
                <label>Location (Postcode)</label>
                <input type="text" id="location" readonly>
            </div>
            <div class="form-group">
                <label>Employment Start Date</label>
                <input type="text" id="startDate" readonly>
            </div>
        </div>

        <div class="form-group" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
            <label>Would the employee like an exit interview with HR/Recruitment?</label>
            <select id="exitInterview" onchange="toggleInterview()" required>
                <option value="">-- Select --</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </div>

        <div id="exitInterviewSection">
            <div class="form-group" style="margin-bottom:0;">
                <label>Manager's Email Address (to send schedule link)</label>
                <input type="email" id="managerEmail" placeholder="manager@example.com">
            </div>
        </div>

        <button type="submit" id="submitBtn" style="margin-top: 30px;">Initiate Offboarding</button>
    </form>
</div>
</body>
</html>
