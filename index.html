<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initiate Offboarding – NGU</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- EmailJS loaded as a regular script (NOT a module) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
:root {
  --bg:#0A1628; --bg2:#111f38; --bg3:#1a2942;
  --border:#2a3f5f;
  --text:#E8EDF2; --muted:#7a8fa8;
  --accent:#00A3E0; --accent2:#005EB8;
  --green:#10B981; --red:#EF4444;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 30px 20px;
}
.container {
  max-width: 820px;
  margin: 0 auto;
  background: var(--bg2);
  padding: 36px;
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.header { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.header h1 { color: var(--accent); font-size: 1.6rem; margin-bottom: 4px; }
.header p { color: var(--muted); font-size: 0.9rem; }

.form-group { margin-bottom: 18px; }
label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

input, select, textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg3);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  transition: border-color 0.2s;
  outline: none;
}
input:focus, select:focus { border-color: var(--accent); }
input[readonly] {
  background: rgba(10,22,40,0.6);
  color: var(--muted);
  cursor: not-allowed;
  border-color: var(--border);
}

/* Search wrapper */
.search-wrap { position: relative; }
.search-wrap input { padding-right: 36px; }
.search-wrap .search-icon {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 1rem;
}
/* Custom dropdown results */
#dropdown-results {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--bg2);
  border: 1px solid var(--accent);
  border-radius: 8px;
  max-height: 220px;
  overflow-y: auto;
  z-index: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
#dropdown-results .drp-item {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 0.95rem;
  transition: background 0.15s;
  border-bottom: 1px solid var(--border);
}
#dropdown-results .drp-item:last-child { border-bottom: none; }
#dropdown-results .drp-item:hover, #dropdown-results .drp-item.active { background: rgba(0,163,224,0.12); color: var(--accent); }
#dropdown-results .drp-item .sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.section-divider { border: none; border-top: 1px solid var(--border); margin: 26px 0; }

.info-card {
  background: rgba(0,163,224,0.05);
  border: 1px solid rgba(0,163,224,0.25);
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 18px;
  font-size: 0.85rem;
  color: var(--muted);
}

#exitInterviewSection {
  display: none;
  padding: 18px;
  background: var(--bg3);
  border-radius: 8px;
  margin-top: 10px;
  border: 1px solid var(--border);
}

button[type="submit"] {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: white;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  margin-top: 10px;
}
button[type="submit"]:hover:not(:disabled) { background: var(--accent2); }
button[type="submit"]:active { transform: scale(0.99); }
button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

.toast {
  position: fixed; bottom: 24px; right: 24px;
  padding: 14px 22px;
  border-radius: 8px;
  font-weight: 500;
  font-size: 0.9rem;
  z-index: 9999;
  display: none;
  animation: fadeUp 0.3s ease;
}
.toast.success { background: rgba(16,185,129,0.15); border: 1px solid var(--green); color: var(--green); }
.toast.error { background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: var(--red); }
@keyframes fadeUp {
  from { opacity:0; transform: translateY(10px); }
  to { opacity:1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Initiate Employee Offboarding</h1>
    <p>Search for the staff member leaving and complete the offboarding form below.</p>
  </div>

  <form id="offboardForm" onsubmit="submitOffboarding(event)" novalidate>

    <!-- Employee Search -->
    <div class="form-group">
      <label>Search Staff Member</label>
      <div class="search-wrap">
        <input type="text" id="employeeSearch" placeholder="Start typing a name..." autocomplete="off" oninput="filterEmployees()">
        <span class="search-icon">🔍</span>
        <div id="dropdown-results"></div>
      </div>
      <input type="hidden" id="selectedEmployeeId">
    </div>

    <!-- Auto-populated fields -->
    <div class="grid-2">
      <div class="form-group">
        <label>Employee Name</label>
        <input type="text" id="empName" readonly>
      </div>
      <div class="form-group">
        <label>Employee Number</label>
        <input type="text" id="empNum" readonly>
      </div>
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" id="jobTitle" readonly>
      </div>
      <div class="form-group">
        <label>Contract Type</label>
        <input type="text" id="contract" readonly>
      </div>
      <div class="form-group">
        <label>Line Manager / FTM</label>
        <input type="text" id="manager" readonly>
      </div>
      <div class="form-group">
        <label>Location (Postcode)</label>
        <input type="text" id="location" readonly>
      </div>
      <div class="form-group">
        <label>Employment Start Date</label>
        <input type="text" id="startDate" readonly>
      </div>
    </div>

    <hr class="section-divider">

    <!-- Additional fields -->
    <div class="form-group">
      <label>Leaver's Personal Email</label>
      <input type="email" id="personalEmail" placeholder="e.g. john.smith@gmail.com" required>
    </div>

    <div class="form-group">
      <label>Last Working Day</label>
      <input type="date" id="lastDay" required>
    </div>

    <div class="form-group">
      <label>Reason for Leaving</label>
      <select id="leaveReason" required>
        <option value="">-- Select reason --</option>
        <option>Resignation</option>
        <option>Redundancy</option>
        <option>End of Contract</option>
        <option>Retirement</option>
        <option>Dismissal</option>
        <option>Mutual Agreement</option>
        <option>Other</option>
      </select>
    </div>

    <hr class="section-divider">

    <!-- Exit interview -->
    <div class="form-group">
      <label>Would the employee like an exit interview with HR/Recruitment?</label>
      <select id="exitInterview" onchange="toggleInterview()" required>
        <option value="">-- Select --</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <div id="exitInterviewSection">
      <div class="form-group" style="margin-bottom:0;">
        <label>Manager's Email Address (to receive scheduling link)</label>
        <input type="email" id="managerEmail" placeholder="manager@ngu.co.uk">
      </div>
    </div>

    <button type="submit" id="submitBtn" disabled>Initiate Offboarding</button>
  </form>
</div>

<div id="toast" class="toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getFirestore, collection, getDocs, addDoc, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCMmUOdW2uEIGVd6XQfWXKF8eaFmwEog1g",
    authDomain: "oesperformance-a54c0.firebaseapp.com",
    projectId: "oesperformance-a54c0",
    storageBucket: "oesperformance-a54c0.firebasestorage.app",
    messagingSenderId: "484894102454",
    appId: "1:484894102454:web:17535ee497eac2d90d6717"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Expose db to global so the non-module script can use it
  window._db = db;
  window._addDoc = addDoc;
  window._setDoc = setDoc;
  window._collection = collection;
  window._doc = doc;

  // Load staff
  window._staffData = {};
  let allStaff = [];

  try {
    const snap = await getDocs(collection(db, 'Establishment Report'));
    snap.forEach(d => {
      const data = d.data();
      if (data._type === 'staff') {
        const entry = { id: d.id, ...data };
        window._staffData[d.id] = entry;
        allStaff.push(entry);
      }
    });
    window._allStaff = allStaff;
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = 'Initiate Offboarding';
  } catch (err) {
    console.error('Firebase load error:', err);
    showToast('Failed to load staff data. Check console for details.', 'error');
  }
</script>

<!-- UI logic (non-module so it can call global window functions) -->
<script>
  emailjs.init("ziLnha91scpGjFABh");

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }
  window.showToast = showToast;

  function filterEmployees() {
    const query = document.getElementById('employeeSearch').value.toLowerCase().trim();
    const results = document.getElementById('dropdown-results');
    results.innerHTML = '';
    if (!query || !window._allStaff) { results.style.display = 'none'; return; }

    const matches = window._allStaff.filter(e =>
      (e.name || '').toLowerCase().includes(query)
    );

    if (matches.length === 0) {
      results.style.display = 'none';
      return;
    }

    matches.slice(0, 12).forEach(emp => {
      const item = document.createElement('div');
      item.className = 'drp-item';
      item.innerHTML = `<div>${emp.name}</div><div class="sub">${emp.jobTitle || ''} &nbsp;|&nbsp; ${emp.id}</div>`;
      item.addEventListener('mousedown', () => selectEmployee(emp));
      results.appendChild(item);
    });
    results.style.display = 'block';
  }
  window.filterEmployees = filterEmployees;

  function selectEmployee(emp) {
    document.getElementById('employeeSearch').value = emp.name;
    document.getElementById('selectedEmployeeId').value = emp.id;
    document.getElementById('empName').value = emp.name || '';
    document.getElementById('empNum').value = emp.id || '';
    document.getElementById('jobTitle').value = emp.jobTitle || '';
    document.getElementById('contract').value = emp.contract || '';
    document.getElementById('manager').value = emp.manager || '';
    document.getElementById('location').value = emp.postcode || '';
    document.getElementById('startDate').value = emp.createdAt || '';
    document.getElementById('dropdown-results').style.display = 'none';
  }

  // Hide dropdown when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      document.getElementById('dropdown-results').style.display = 'none';
    }
  });

  window.toggleInterview = function() {
    const val = document.getElementById('exitInterview').value;
    document.getElementById('exitInterviewSection').style.display = val === 'yes' ? 'block' : 'none';
  };

  window.submitOffboarding = async function(e) {
    e.preventDefault();

    const empId = document.getElementById('selectedEmployeeId').value;
    if (!empId) return showToast('Please search and select a staff member first.', 'error');

    const personalEmail = document.getElementById('personalEmail').value.trim();
    if (!personalEmail) return showToast('Please enter the leaver\'s personal email.', 'error');

    const lastDay = document.getElementById('lastDay').value;
    if (!lastDay) return showToast('Please enter the last working day.', 'error');

    const leaveReason = document.getElementById('leaveReason').value;
    if (!leaveReason) return showToast('Please select a reason for leaving.', 'error');

    const exitChoice = document.getElementById('exitInterview').value;
    if (!exitChoice) return showToast('Please select whether the employee wants an exit interview.', 'error');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    const empName = document.getElementById('empName').value;
    const managerEmail = document.getElementById('managerEmail').value.trim();
    const wantsInterview = exitChoice === 'yes';

    try {
      const offboardData = {
        employeeId: empId,
        name: empName,
        jobTitle: document.getElementById('jobTitle').value,
        contract: document.getElementById('contract').value,
        manager: document.getElementById('manager').value,
        location: document.getElementById('location').value,
        startDate: document.getElementById('startDate').value,
        lastWorkingDay: lastDay,
        leaveReason: leaveReason,
        personalEmail: personalEmail,
        exitInterviewRequested: wantsInterview,
        managerEmail: managerEmail,
        initiatedAt: new Date().toISOString()
      };

      // Save to Offboarding Forms
      const docRef = await window._addDoc(window._collection(window._db, "Offboarding Forms"), offboardData);
      const checklistId = docRef.id;

      // Create matching checklist document
      await window._setDoc(window._doc(window._db, "offboarding checklist", checklistId), {
        employeeId: empId,
        name: empName,
        jobTitle: document.getElementById('jobTitle').value,
        manager: document.getElementById('manager').value,
        lastWorkingDay: lastDay,
        leaveReason: leaveReason,
        initiatedAt: new Date().toISOString()
      });

      // Email 1: Resignation confirmation to leaver
      await emailjs.send("service_hdd4x8i", "template_sv97s64", {
        to_email: personalEmail,
        employee_name: empName,
        last_working_day: lastDay
      });

      // Email 2: Notify all departments
      const portalLink = window.location.href.replace('index.html', '') + `checklist.html?id=${checklistId}`;
      await emailjs.send("service_hdd4x8i", "template_r1ehsyt", {
        employee_name: empName,
        checklist_link: portalLink,
        last_working_day: lastDay
      });

      // Email 3: Exit interview scheduling link to manager
      if (wantsInterview && managerEmail) {
        const bookingLink = window.location.href.replace('index.html', '') + `book-exit-interview.html?id=${checklistId}`;
        await emailjs.send("service_hdd4x8i", "template_okr3omr", {
          to_email: managerEmail,
          employee_name: empName,
          booking_link: bookingLink
        });
      }

      showToast('Offboarding successfully initiated! Emails have been sent.', 'success');
      setTimeout(() => window.location.reload(), 3000);

    } catch (err) {
      console.error(err);
      showToast('Error: ' + err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Initiate Offboarding';
    }
  };
</script>
</body>
</html>
