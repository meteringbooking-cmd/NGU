<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2563eb;--accent-rgb:37,99,235;--primary:#1e4fc1;
  --bg-dark:#f4f6f9;--bg-card:#ffffff;--bg-input:#ffffff;--bg-subtle:#f8fafc;
  --text-light:#0f172a;--text-muted:#64748b;
  --border:#dbe2ea;--border-soft:#edf1f5;
  --success:#15803d;--error:#dc2626;--warning:#b45309;
  --ok-text:#15803d;--err-text:#b91c1c;--warn-text:#92400e;--info-text:#1e40af;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg-dark);color:var(--text-light);min-height:100vh;padding:1.5rem 1rem 3rem}
.topbar{max-width:1200px;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{width:120px}
.nav{display:flex;gap:.5rem;flex-wrap:wrap}
.nav a{color:var(--text-muted);text-decoration:none;font-weight:600;font-size:.9rem;padding:.55rem .9rem;border:1px solid var(--border);border-radius:10px;transition:all .2s}
.nav a:hover,.nav a.active{color:var(--text-light);border-color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.wrap{max-width:1200px;margin:0 auto}
.page-header{margin-bottom:1.5rem}
.page-header h1{font-size:1.9rem;font-weight:800;color:var(--text-light);letter-spacing:-.03em;margin-bottom:.4rem}
.page-header p{color:var(--text-muted);line-height:1.55;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.2rem}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.3rem;display:flex;flex-direction:column;box-shadow:var(--shadow);min-height:420px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:.3rem}
.panel h2{font-size:1.1rem;font-weight:700}
.count{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--accent);background:rgba(var(--accent-rgb),.1);padding:.15rem .5rem;border-radius:6px}
.panel .hint{font-size:.8rem;color:var(--text-muted);margin-bottom:.9rem}
.add-row{display:flex;gap:.5rem;margin-bottom:.6rem}
input[type=text],textarea{width:100%;padding:.7rem .85rem;background:var(--bg-input);border:2px solid var(--border);border-radius:10px;color:var(--text-light);font-size:.95rem;font-family:inherit;outline:none;transition:all .2s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:.7rem 1rem;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(var(--accent-rgb),.3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:.4rem .7rem;font-size:.8rem;cursor:pointer;font-family:inherit}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.bulk{display:none;margin-bottom:.6rem}
.bulk.open{display:block}
.bulk .btn{margin-top:.5rem;width:100%}
.tools{display:flex;gap:.4rem;margin-bottom:.6rem;flex-wrap:wrap}
.search{margin-bottom:.6rem}
.list{list-style:none;flex:1;overflow-y:auto;max-height:420px;border:1px solid var(--border-soft);border-radius:10px;background:var(--bg-subtle)}
.list li{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.55rem .75rem;border-bottom:1px solid var(--border-soft);font-size:.92rem}
.list li:last-child{border-bottom:none}
.list li:hover{background:rgba(var(--accent-rgb),.05)}
.list .empty{color:var(--text-muted);justify-content:center;font-size:.85rem;padding:1.2rem}
.rm{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:var(--err-text);border-radius:7px;width:28px;height:28px;cursor:pointer;flex-shrink:0;font-size:.85rem}
.rm:hover{background:rgba(220,38,38,.25);border-color:var(--error)}
.status{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(150%);background:var(--bg-card);border:1px solid var(--border);padding:.75rem 1.1rem;border-radius:12px;font-size:.9rem;font-weight:600;transition:transform .25s,opacity .25s;z-index:20;max-width:calc(100% - 2rem);opacity:0;pointer-events:none}
.status.show{transform:translateX(-50%) translateY(0);opacity:1}
.status.ok{border-color:var(--success);color:var(--ok-text)}
.status.err{border-color:var(--error);color:var(--err-text)}
.loading{color:var(--text-muted);padding:2rem;text-align:center}
@media (max-width:600px){.page-header h1{font-size:1.5rem}.logo{width:100px}}

/* shared header */
.topbar{padding-bottom:1rem;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;color:var(--text-light)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-mark svg{width:20px;height:20px}
.brand-logo{max-height:38px;max-width:160px;object-fit:contain}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-weight:700;font-size:1rem;letter-spacing:-.01em}
.brand-company{font-size:.78rem;color:var(--text-muted)}
.nav a{border-color:transparent!important;background:transparent}
.nav a:hover{background:var(--bg-card)!important;border-color:var(--border)!important;color:var(--text-light)!important}
.nav a.active{background:rgba(var(--accent-rgb),.1)!important;color:var(--accent)!important;border-color:transparent!important}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="auditing-homepage.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l2 2 4-4"/><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/></svg></span><span class="brand-text"><span class="brand-name" data-brand="appName">Compliance Audits</span><span class="brand-company" data-brand="companyName" hidden></span></span></a>
  <nav class="nav">
    <a href="auditing-homepage.html">Home</a>
    <a href="audit-selection.html">New Audit</a>
    <a href="audit-review.html">Audit Review</a>
    <a href="question-review.html">Questions</a>
    <a href="addname.html" class="active">Lists</a>
  </nav>
</header>

<div class="wrap">
  <div class="page-header">
    <h1>Audit Lists</h1>
    <p>Manage the names and contracts offered in the audit forms. Changes save straight away and appear in the dropdowns the next time an audit is opened.</p>
  </div>
  <div class="grid" id="grid"><div class="loading">Loading lists…</div></div>
</div>

<div class="status" id="status"></div>

<script type="module">
import { BRAND, FIREBASE_CONFIG, DEFAULT_LISTS as CONFIG_LISTS, applyBranding } from './audit-config.js';
applyBranding('Audit Lists');
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = FIREBASE_CONFIG;
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const LISTS_COLLECTION = 'Compliance Audit Lists';

// Starting lists come from audit-config.js – used to seed an empty list.
const DEFAULTS = CONFIG_LISTS;

const LISTS = [
  { id:'engineers',    title:'Installers / Engineers', hint:'Used for "Installer/Engineer name".', placeholder:'e.g. Jane Smith' },
  { id:'contracts',    title:'Contracts',              hint:'Used for "Contract".',                placeholder:'e.g. SESM - OES' },
  { id:'lineManagers', title:'Line Managers',          hint:'Used for "Line Manager".',            placeholder:'e.g. Stuart Whyte' },
  { id:'auditors',     title:'Auditors',               hint:'Used for "Audited by".',              placeholder:'e.g. Ricky Johnson' }
];

const state = {};
const filters = {};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.trim().replace(/\s+/g,' ');

let statusTimer;
function toast(msg, kind='ok'){
  const el=$('status'); el.textContent=msg; el.className='status show '+kind;
  clearTimeout(statusTimer); statusTimer=setTimeout(()=>el.className='status',2600);
}

function buildPanels(){
  $('grid').innerHTML = LISTS.map(l=>`
    <section class="panel" id="panel-${l.id}">
      <div class="panel-head"><h2>${l.title}</h2><span class="count" id="count-${l.id}">0</span></div>
      <p class="hint">${l.hint}</p>
      <div class="add-row">
        <input type="text" id="input-${l.id}" placeholder="${esc(l.placeholder)}" autocomplete="off">
        <button class="btn" data-add="${l.id}">Add</button>
      </div>
      <div class="tools">
        <button class="btn-ghost" data-bulk="${l.id}">Add several</button>
        <button class="btn-ghost" data-defaults="${l.id}">Restore defaults</button>
      </div>
      <div class="bulk" id="bulk-${l.id}">
        <textarea id="bulkText-${l.id}" placeholder="One per line"></textarea>
        <button class="btn" data-bulkadd="${l.id}">Add all</button>
      </div>
      <input type="text" class="search" id="search-${l.id}" placeholder="Search…" autocomplete="off">
      <ul class="list" id="list-${l.id}"><li class="empty">Loading…</li></ul>
    </section>`).join('');

  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addItems(b.dataset.add,[$('input-'+b.dataset.add).value]));
  LISTS.forEach(l=>{
    $('input-'+l.id).addEventListener('keydown',e=>{ if(e.key==='Enter') addItems(l.id,[e.target.value]); });
    $('search-'+l.id).addEventListener('input',e=>{ filters[l.id]=e.target.value.toLowerCase(); render(l.id); });
  });
  document.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=()=>$('bulk-'+b.dataset.bulk).classList.toggle('open'));
  document.querySelectorAll('[data-bulkadd]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.bulkadd; addItems(id,$('bulkText-'+id).value.split(/\r?\n|,/)).then(ok=>{ if(ok){ $('bulkText-'+id).value=''; $('bulk-'+id).classList.remove('open'); } });
  });
  document.querySelectorAll('[data-defaults]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.defaults;
    const missing=DEFAULTS[id].filter(d=>!(state[id]||[]).some(x=>x.toLowerCase()===d.toLowerCase()));
    if(!missing.length) return toast('All defaults are already in the list');
    if(confirm(`Add ${missing.length} default entr${missing.length>1?'ies':'y'} (from audit-config.js) back into this list?`)) addItems(id,missing);
  });
}

function render(id){
  const items=[...(state[id]||[])].sort((a,b)=>a.localeCompare(b,'en',{sensitivity:'base'}));
  const f=filters[id]||'';
  const shown=f?items.filter(i=>i.toLowerCase().includes(f)):items;
  $('count-'+id).textContent=items.length;
  $('list-'+id).innerHTML = shown.length
    ? shown.map(i=>`<li><span>${esc(i)}</span><button class="rm" title="Remove" data-rm="${esc(i)}">✕</button></li>`).join('')
    : `<li class="empty">${items.length?'No matches':'Nothing added yet'}</li>`;
  $('list-'+id).querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>removeItem(id,b.dataset.rm));
}

async function addItems(id, raw){
  const existing=(state[id]||[]).map(x=>x.toLowerCase());
  const seen=new Set();
  const items=raw.map(norm).filter(Boolean).filter(v=>{const k=v.toLowerCase(); if(existing.includes(k)||seen.has(k)) return false; seen.add(k); return true;});
  if(!items.length){ toast(raw.some(r=>norm(r))?'Already in the list':'Type a name first','err'); return false; }
  try{
    await setDoc(doc(db,LISTS_COLLECTION,id),{ items:arrayUnion(...items), updatedAt:serverTimestamp() },{ merge:true });
    $('input-'+id).value='';
    toast(items.length===1?`Added ${items[0]}`:`Added ${items.length} entries`);
    return true;
  }catch(e){ console.error(e); toast('Could not save – check your connection','err'); return false; }
}

async function removeItem(id, value){
  if(!confirm(`Remove "${value}"?\n\nExisting audit records keep this name; it just won't be offered in new audits.`)) return;
  try{
    await updateDoc(doc(db,LISTS_COLLECTION,id),{ items:arrayRemove(value), updatedAt:serverTimestamp() });
    toast(`Removed ${value}`);
  }catch(e){ console.error(e); toast('Could not remove – check your connection','err'); }
}

buildPanels();

// Live listeners; seed a list with the defaults the first time it is opened.
LISTS.forEach(l=>{
  const ref=doc(db,LISTS_COLLECTION,l.id);
  getDoc(ref).then(snap=>{
    if(!snap.exists()) return setDoc(ref,{ items:DEFAULTS[l.id], updatedAt:serverTimestamp() });
  }).catch(e=>console.error(e));
  onSnapshot(ref, snap=>{
    state[l.id]=snap.exists()?(snap.data().items||[]):[];
    render(l.id);
  }, err=>{ console.error(err); $('list-'+l.id).innerHTML='<li class="empty">Could not load this list</li>'; });
});
</script>
</body>
</html>
